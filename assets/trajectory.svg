    <g fill="#237859"><circle cx="70" cy="158" r="10"/><circle cx="70" cy="280" r="10"/><circle cx="70" cy="402" r="10"/><circle cx="70" cy="524" r="10"/></g>
    <g fill="#53665b" font-size="18">
